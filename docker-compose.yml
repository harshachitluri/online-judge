# =============================================================================
# CodeJudge — docker compose
# =============================================================================
# MongoDB is NOT a service here. The database lives in MongoDB Atlas, which
# means: nothing to expose on 27017, no root password sitting in this file,
# and backups handled by someone else. MONGO_URI in .env points at it.
#
# Build the images first (both targets come from the single root Dockerfile):
#   docker build --target runner  -t codejudge-runner  .
#   docker build --target backend -t codejudge-backend .
#
# Then:
#   docker compose up -d
# =============================================================================

services:

  backend:
    image: codejudge-backend:latest
    container_name: codejudge-backend
    restart: unless-stopped

    ports:
      # Bound to loopback only — Caddy terminates TLS on 443 and proxies
      # here. Publishing 0.0.0.0:5001 would put the plain-HTTP API on the
      # public internet alongside the HTTPS one.
      - "127.0.0.1:${PORT:-5001}:5001"

    environment:
      NODE_ENV:            production
      PORT:                5001

      # Atlas connection string — required, no default worth guessing.
      MONGO_URI:           ${MONGO_URI:?MONGO_URI must be set}
      JWT_SECRET:          ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGIN:         ${CORS_ORIGIN:-http://localhost:3000}

      # Sits behind Caddy, so req.ip must come from X-Forwarded-For or every
      # visitor shares one rate-limit bucket.
      TRUST_PROXY:         "true"

      # Untrusted code runs in throwaway runner containers.
      DOCKER_ENABLED:      "true"
      DOCKER_RUNNER_IMAGE: codejudge-runner:latest
      DOCKER_MEMORY:       ${DOCKER_MEMORY:-256m}
      DOCKER_CPUS:         ${DOCKER_CPUS:-0.5}
      DOCKER_PIDS_LIMIT:   ${DOCKER_PIDS_LIMIT:-50}

      # Concurrent judge jobs. Each one can hold DOCKER_MEMORY, so on a
      # 1GB box this wants to be 2, not the default 5.
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}

      # Where ./backend/src/temp actually lives on the host. The backend
      # passes bind-mount paths to the *host's* Docker daemon when it spawns
      # runner containers; without this it would pass its own container
      # paths, which the daemon can't resolve. Must match the bind mount
      # below. See toHostPath() in executeInDocker.js.
      HOST_TEMP_PATH:      ${PWD}/backend/src/temp

      # Email + AI. Optional — the app degrades honestly without them.
      FRONTEND_URL:        ${FRONTEND_URL:-}
      SMTP_HOST:           ${SMTP_HOST:-}
      SMTP_PORT:           ${SMTP_PORT:-587}
      SMTP_USER:           ${SMTP_USER:-}
      SMTP_PASS:           ${SMTP_PASS:-}
      SMTP_FROM:           ${SMTP_FROM:-}
      GEMINI_API_KEY:      ${GEMINI_API_KEY:-}
      GEMINI_MODEL:        ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_CLIENT_ID:    ${GOOGLE_CLIENT_ID:-}

    volumes:
      # The backend spawns sibling runner containers through this socket.
      # It is effectively root on the host — the single biggest reason the
      # runner image is locked down as hard as it is.
      - /var/run/docker.sock:/var/run/docker.sock

      # Source and compiled binaries, shared with the runner containers by
      # bind mount. Paired with HOST_TEMP_PATH above.
      - ./backend/src/temp:/app/src/temp
