# =============================================================
# CodeJudge — docker-compose
# =============================================================
# Port Mapping (from your notes, Image 1):
#
#   Our System (local)  ←→  Container
#   ─────────────────       ──────────
#   localhost:5001      ←→  backend:5001   (API + Judge Worker)
#   localhost:27017     ←→  mongo:27017    (MongoDB)
#
# "Whatever running on container port, it should reflect in my local port"
#
# Security (from your notes, Images 3 & 4):
#   User code is ISOLATED inside codejudge-runner containers.
#   Backend gets access to Docker socket to spawn those containers.
#   Runner containers have: no network, memory cap, PID limit, read-only FS.
#
# How to start:
#   1. Build images first (Dockerfile → Docker Image):
#         docker build -f backend/Dockerfile.runner -t codejudge-runner .
#         docker build -f backend/Dockerfile       -t codejudge-backend .
#
#   2. Start all services:
#         docker compose up -d
# =============================================================

version: "3.9"

networks:
  codejudge-net:
    driver: bridge

volumes:
  mongo-data:         # MongoDB persistent storage

services:

  # ── MongoDB ─────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: codejudge-mongo
    restart: unless-stopped
    networks:
      - codejudge-net
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-secret}
    ports:
      # Port Mapping: local:27017 ←→ container:27017
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js API + Judge Worker) ────────────────────────
  backend:
    image: codejudge-backend:latest   # built from backend/Dockerfile
    container_name: codejudge-backend
    restart: unless-stopped
    networks:
      - codejudge-net
    depends_on:
      mongo:
        condition: service_healthy    # wait for Mongo to be ready
    ports:
      # Port Mapping: local:5001 ←→ container:5001
      - "${PORT:-5001}:5001"
    environment:
      NODE_ENV:           production
      PORT:               5001
      MONGO_URI:          mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-secret}@mongo:27017/codejudge?authSource=admin
      JWT_SECRET:         ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGIN:        ${CORS_ORIGIN:-http://localhost:3000}
      # Docker execution — code runs in isolated runner containers
      DOCKER_ENABLED:     "true"
      DOCKER_RUNNER_IMAGE: codejudge-runner:latest
      DOCKER_MEMORY:      "256m"
      DOCKER_CPUS:        "0.5"
      DOCKER_PIDS_LIMIT:  "50"
    volumes:
      # Docker socket — backend spawns runner containers via this
      - /var/run/docker.sock:/var/run/docker.sock
      # Temp code files — runner containers mount code from here
      - ./backend/src/temp:/app/src/temp
