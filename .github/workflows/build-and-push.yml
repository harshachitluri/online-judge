# =============================================================================
# Build both images and push them to Amazon ECR
# =============================================================================
# Why this exists rather than building on the server: a t3.micro has 1GB of
# RAM, and `npm ci` plus an Alpine JDK install competes with the running app
# for it. GitHub's runners are x86 and free for this, so the slow work happens
# here and the server only ever pulls a finished image.
#
# It also fixes the architecture problem: a MacBook is arm64, t3.micro is
# x86_64, and images built on the laptop simply will not run on the instance.
# These runners are natively x86_64, so no QEMU emulation is involved.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_ACCOUNT_ID          e.g. 123456789012
# =============================================================================

name: Build and push to ECR

on:
  push:
    branches: [master]
    # Docs-only commits shouldn't burn 10 minutes of build time.
    paths-ignore:
      - "**.md"
      - "frontend/**"
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  RUNNER_REPO: codejudge-runner
  BACKEND_REPO: codejudge-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Both images are tagged twice: with the commit SHA (immutable, so a
      # rollback can name an exact build) and with `latest` (what the server
      # pulls by default).
      - name: Build and push runner
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.RUNNER_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.RUNNER_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.ecr.outputs.registry }}/${{ env.RUNNER_REPO }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploy on the server with: ./deploy.sh" >> $GITHUB_STEP_SUMMARY
